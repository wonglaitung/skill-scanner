name: skill-nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-nightly
  cancel-in-progress: false

jobs:
  llm-evals:
    # 需要自托管 runner，且能访问本地模型网关 http://localhost:8086/v1
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    env:
      SKILL_API_BASE: http://localhost:8086/v1
      SKILL_MODEL: qwen3
      JUDGE_MODEL: qwen3
      JUDGE_API_BASE: http://localhost:8086/v1
      SKILL_TIMEOUT: "180"
      DEEPEVAL_PER_ATTEMPT_TIMEOUT_SECONDS_OVERRIDE: "300"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -r requirements-eval.txt
          npm install

      - name: Promptfoo smoke
        run: npx promptfoo eval -c evals/promptfooconfig.smoke.yaml --max-concurrency 1

      - name: Promptfoo per-skill
        run: |
          npx promptfoo eval -c evals/promptfooconfig.write-report.yaml --max-concurrency 1
          npx promptfoo eval -c evals/promptfooconfig.system-specification.yaml --max-concurrency 1
          npx promptfoo eval -c evals/promptfooconfig.manager-report.yaml --max-concurrency 1

      - name: DeepEval S2
        run: deepeval test run evals/deepeval/test_s2_skills.py

      - name: Garak light scan
        run: |
          python3 -m garak --target_type rest -G evals/garak/rest_config.json \
            --spec probes.dan.Dan_11_0 --generations 1 \
            --report_prefix "$PWD/reports/garak_dan"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: reports/
          if-no-files-found: ignore
