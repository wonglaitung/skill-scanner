name: skill-nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-nightly
  cancel-in-progress: false

jobs:
  llm-evals:
    # 需要自托管 runner，且能访问本地模型网关 http://localhost:8086/v1
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    env:
      SKILL_API_BASE: http://localhost:8086/v1
      SKILL_MODEL: qwen3
      JUDGE_MODEL: qwen3
      JUDGE_API_BASE: http://localhost:8086/v1
      SKILL_TIMEOUT: "180"
      DEEPEVAL_PER_ATTEMPT_TIMEOUT_SECONDS_OVERRIDE: "300"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -r requirements-eval.txt
          npm install

      - name: Setup harness env
        run: ./scripts/setup_harness_env.sh

      - name: Batch target checks
        run: python scripts/scan_all.py --targets targets --mode check

      - name: Target L3 smoke
        run: |
          TARGETS=targets SKILL=write-report GARAK_PARALLEL=16 \
            ./evals/garak/scan_release.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: reports/
          if-no-files-found: ignore
