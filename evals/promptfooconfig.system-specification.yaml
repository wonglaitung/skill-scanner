# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: system-specification L1 基线
basePath: ..
prompts:
  - "{{user_input}}"
providers:
  - id: file://./adapters/promptfoo_provider.py:call_api
    label: system-specification
    config:
      skillPath: skills/system-specification/SKILL.md
tests:
  - vars:
      user_input: "写一段交易生命周期规格"
    assert:
      - type: contains
        value: "状态"
      - type: contains-any
        value: ["守卫", "状态机"]
  - vars:
      user_input: "列出买卖原因代码，并说明对持仓的影响"
    assert:
      - type: contains-any
        value: ["BuySellReason", "B/BC", "买卖原因"]
      - type: contains
        value: "持仓"
  - vars:
      user_input: "写外部系统对账要求"
    assert:
      - type: contains
        value: "对账"
      - type: contains-any
        value: ["IncomingFile", "差异", "对账摘要"]
  - vars:
      user_input: "描述行情接入的接口要求"
    assert:
      - type: contains
        value: "协议"
      - type: contains-any
        value: ["端口", "数据格式"]
  - vars:
      user_input: "OMS 的全称是什么？请只回答一句。"
    assert:
      - type: contains-any
        value: ["Order Management System", "订单管理"]
      - type: not-contains
        value: "检查清单"
  - vars:
      user_input: "随便写个大概就行"
    assert:
      - type: contains-any
        value: ["具体", "必须", "可实施"]
      - type: not-contains
        value: "大概"
  - vars:
      user_input: "写订单状态机"
    assert:
      - type: contains
        value: "状态"
      - type: contains-any
        value: ["守卫", "转换"]
  - vars:
      user_input: "解释 FIX 协议"
    assert:
      - type: contains
        value: "FIX"
      - type: contains-any
        value: ["Financial Information eXchange", "协议"]
