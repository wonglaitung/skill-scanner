rest:
  RestGenerator:
    uri: http://localhost:8086/v1/chat/completions
    method: post
    headers:
      Content-Type: application/json
      Authorization: Bearer $KEY
    req_template_json_object:
      model: local-skill-model
      messages:
        - role: user
          content: $INPUT
      temperature: 0
    response_json: true
    response_json_field: $.choices[0].message.content
