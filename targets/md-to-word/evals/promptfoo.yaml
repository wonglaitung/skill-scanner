# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: md-to-word 脚本型 Skill 基线
basePath: ..
prompts:
  - "{{user_input}}"
providers:
  - id: file://./adapter.py:call_api
    label: md-to-word
tests:
  - vars:
      user_input: "# 主标题\n\n这是正文。\n"
    assert:
      - type: contains
        value: "主标题"
      - type: contains
        value: "这是正文"
  - vars:
      user_input: "# 清单\n\n- 项目一\n- 项目二\n"
    assert:
      - type: contains
        value: "项目一"
      - type: contains
        value: "项目二"
  - vars:
      user_input: "| 名称 | 数量 |\n|---|---|\n| 苹果 | 3 |\n"
    assert:
      - type: contains
        value: "苹果"
      - type: contains
        value: "3"
  - vars:
      user_input: "```python\nprint('hello')\n```\n"
    assert:
      - type: contains
        value: "print"
      - type: contains
        value: "hello"
  - vars:
      user_input: ""
    assert:
      - type: not-contains
        value: "Traceback"
